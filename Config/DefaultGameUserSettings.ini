[/Script/HeatlineMX.MXGameUserSettings]
; Start in a 1600x900 window (see MXGameUserSettings.h: full screen froze at launch on macOS).
; Version must equal the engine's UE_GAMEUSERSETTINGS_VERSION (5 in UE 5.8), or the engine ignores these
; values on the first launch and falls back to full screen.
Version=5
; 2 = windowed
FullscreenMode=2
LastConfirmedFullscreenMode=2
PreferredFullscreenMode=2
ResolutionSizeX=1600
ResolutionSizeY=900
LastUserConfirmedResolutionSizeX=1600
LastUserConfirmedResolutionSizeY=900
